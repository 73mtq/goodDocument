name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run Python tests
        run: python -m pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Node.js tests
        run: node --test tests/node/*.test.js

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build EXE
        run: pyinstaller DocFormatter.spec --noconfirm --clean

      - name: Verify EXE
        run: |
          if (Test-Path dist\DocFormatter.exe) {
            Write-Host "OK: EXE built"
            Get-Item dist\DocFormatter.exe | Select-Object LastWriteTime, Length
          } else {
            Write-Error "EXE not found"
            exit 1
          }
          if (-not (Test-Path assets\figure1.png)) {
            Write-Error "示例图片缺失"
            exit 1
          }

      - name: Package with config
        run: |
          Copy-Item config.json dist\config.json -Force
          Copy-Item assets dist\assets -Recurse -Force
          Compress-Archive -Path dist\DocFormatter.exe, dist\config.json, dist\assets -DestinationPath DocFormatter-${{ github.ref_name }}.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFormatter-Windows
          path: DocFormatter-*.zip
          if-no-files-found: error

      - name: Create Release (on tag)
        uses: softprops/action-gh-release@v2
        with:
          files: DocFormatter-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
